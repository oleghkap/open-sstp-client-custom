plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10'
}

// The launcher icon is kept in the repository as base64 text (app/icon_assets) and turned back
// into real image files at build time, into a generated resource folder that is added to the
// app's resources below.
def iconAssetsDir = file('icon_assets')
def generatedIconRes = layout.buildDirectory.dir('generated/icon_res').get().asFile

android {
    namespace 'kittoku.osc'

    compileSdk 36

    defaultConfig {
        applicationId "kittoku.osc"
        minSdk 23
        targetSdk 36
        versionCode 50
        versionName "1.10.3"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            res.srcDir generatedIconRes
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

tasks.register('decodeIconAssets') {
    inputs.dir(iconAssetsDir)
    outputs.dir(generatedIconRes)

    doLast {
        def outDir = new File(generatedIconRes, 'mipmap-xxxhdpi')
        outDir.mkdirs()

        def decode = { String source, String target ->
            def text = new File(iconAssetsDir, source).text.replaceAll('\\s', '')
            new File(outDir, target).bytes = Base64.getDecoder().decode(text)
        }

        decode('ic_launcher.webp.b64', 'ic_launcher.webp')
        decode('ic_launcher.webp.b64', 'ic_launcher_round.webp')
        decode('ic_launcher_foreground.webp.b64', 'ic_launcher_foreground.webp')
    }
}

// everything that builds the app starts from preBuild, so the icon files exist before the
// resources are merged
tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn('decodeIconAssets')
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'com.google.android.material:material:1.13.0'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
